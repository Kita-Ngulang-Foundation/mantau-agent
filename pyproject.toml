[project]
name = "mantau-agent"
version = "0.1.0"
description = "Scenario 2 agent: pulls RTSP on the customer's LAN, opens an outbound tunnel to the server"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "httpx>=0.27",
    "opencv-python-headless>=4.9",  # runs headless on the target hardware; never opens a display
    "numpy>=1.26,<2.3",
    "cryptography>=42",
    # mantau-core is NOT listed here -- see README "Installing mantau-core".
    # Not published anywhere yet; requirements.txt installs it from the
    # local sibling checkout.
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
mantau-agent = "mantau_agent.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
